{% load static %}<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Busca Licitações</title>
  <meta name="description" content="Encontre licitações públicas e receba alertas no celular.">
  <meta name="theme-color" content="#1e3a6b">
  <link rel="manifest" href="{% url 'pwa-manifest' %}">
  <link rel="icon" type="image/png" href="{% static 'app/icon-192.png' %}">
  <link rel="apple-touch-icon" href="{% static 'app/apple-touch-icon.png' %}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Licitações">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="{% static 'app/app.css' %}">
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar">
      <button class="icon-btn" id="btn-back" aria-label="Voltar" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h1 id="page-title">Licitações</h1>
      <span class="topbar-actions" id="topbar-actions"></span>
    </header>
    <div class="offline-banner" id="offline" hidden>Sem conexão. Mostrando o que está salvo.</div>
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar" aria-label="Navegação principal">
      <a href="#/" data-tab="busca">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <span>Buscar</span>
      </a>
      <a href="#/alertas" data-tab="alertas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17V11a6 6 0 0112 0v6l1.5 2h-15z"/><path d="M10 21h4"/></svg>
        <span>Alertas</span>
      </a>
      <a href="#/notificacoes" data-tab="notificacoes">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"/></svg>
          <b class="badge" id="badge-notif" hidden>0</b>
        </span>
        <span>Novidades</span>
      </a>
      <a href="#/conta" data-tab="conta">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
        <span>Conta</span>
      </a>
    </nav>
  </div>
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <noscript>Este aplicativo precisa de JavaScript.</noscript>
  <script src="{% static 'app/app.js' %}"></script>
</body>
</html>
