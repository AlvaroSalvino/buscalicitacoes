name: Deploy para produção

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Nunca dois deploys ao mesmo tempo (ex.: dois pushes seguidos).
concurrency:
  group: deploy-producao
  cancel-in-progress: false

env:
  APP_DIR: /home/meu_app/public_html/buscalicitacoes
  APP_USER: www-data            # mesmo usuário do WSGIDaemonProcess/Apache
  SITE_URL: https://licitacoes.meuapp.dev.br

jobs:
  # ---------------------------------------------------------------------------
  # 1) Só segue para produção se o projeto estiver íntegro.
  # ---------------------------------------------------------------------------
  test:
    name: Testes e verificações
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-nao-e-segredo
      DEBUG: "False"
      DB_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v4

      - name: Banco de dados ou segredos versionados? (bloqueia o deploy)
        run: |
          if git ls-files | grep -Ei '\.sqlite3|(^|/)\.env$|\.corrompido$'; then
            echo "::error::Arquivos de banco/.env estão no git (listados acima). Remova com: git rm --cached <arquivo>"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependências do sistema (mysqlclient)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config default-libmysqlclient-dev

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Django check
        run: python manage.py check

      - name: Migrações versionadas? (falha se faltar arquivo de migração no git)
        run: python manage.py makemigrations --check --dry-run

      - name: Testes
        run: python manage.py test

  # ---------------------------------------------------------------------------
  # 2) Deploy. Não mexe em .env, venv, banco, media nem dispara sincronizações.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy via SSH
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy para o servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 30m   # migrações grandes (ex.: preencher texto_busca) passam de 10 min no padrão
          envs: APP_DIR,APP_USER,SITE_URL
          script: |
            set -euo pipefail
            cd "$APP_DIR"
            PY="$APP_DIR/venv/bin/python"
            # Todo comando Python/Django roda como o usuário do Apache: assim os
            # arquivos do SQLite (-wal/-shm) nunca ficam com dono root.
            run() { sudo -u "$APP_USER" "$@"; }

            # A raiz do projeto pertence ao www-data (para o SQLite), mas o git roda
            # como o usuário do SSH: sem isto o git recusa o repositório
            # ("dubious ownership"). .git fica sempre do usuário do deploy.
            git config --global --get-all safe.directory | grep -qx "$APP_DIR" \
              || git config --global --add safe.directory "$APP_DIR"
            [ "$(stat -c %U .git)" = "$(id -un)" ] || sudo chown -R "$(id -un):$(id -gn)" .git

            PREV=$(git rev-parse HEAD)
            trap 'echo "### FALHA no deploy. Versão anterior: $PREV | backups em $APP_DIR/backups"' ERR

            echo "== 1/8 Backup do banco (antes de QUALQUER mudança)"
            mkdir -p backups && sudo chown "$APP_USER:$APP_USER" backups
            if [ -f db.sqlite3 ]; then
              # .backup é seguro com o banco em uso (inclui o conteúdo do WAL)
              run sqlite3 db.sqlite3 ".backup 'backups/db-$(date +%Y%m%d-%H%M%S).sqlite3'"
              ls -1t backups/db-*.sqlite3 2>/dev/null | tail -n +4 | xargs -r rm -f   # mantém os 3 mais recentes
            fi

            echo "== 2/8 Código"
            # Arquivos do banco NUNCA podem ser tocados pelo git. Versões antigas do
            # repositório versionavam db.sqlite3-wal/-shm (do computador de
            # desenvolvimento): um reset --hard os sobrescreveria e corromperia o
            # banco do servidor. Tirá-los do índice local antes do reset garante
            # que o git os trate como arquivos não rastreados e não mexa neles.
            git rm --cached -f -q --ignore-unmatch -- db.sqlite3 db.sqlite3-wal db.sqlite3-shm
            git fetch origin main
            git reset --hard origin/main      # só arquivos versionados; .env, banco e venv ficam intactos
            NEW=$(git rev-parse HEAD)
            echo "   $PREV -> $NEW"
            if git ls-files | grep -Ei '\.sqlite3|^\.env$'; then
              echo "### O repositório versiona arquivos de banco/.env (listados acima). Abortando."
              exit 1
            fi

            echo "== 3/8 Permissões (sem tocar em venv/ e .git/)"
            sudo find . \( -path ./venv -o -path ./.git \) -prune -o -exec chown "$APP_USER:$APP_USER" {} +
            [ "$(stat -c %U venv)" = "$APP_USER" ] || sudo chown -R "$APP_USER:$APP_USER" venv

            echo "== 4/8 Dependências"
            run "$PY" -m pip install -q -r requirements.txt

            echo "== 5/8 Verificar, migrar e coletar estáticos"
            run "$PY" manage.py check
            run "$PY" manage.py migrate --noinput
            run "$PY" manage.py collectstatic --noinput

            echo "== 6/8 Recarregar aplicação"
            run touch buscalicitacoes/wsgi.py          # mod_wsgi (daemon) recarrega o código

            echo "== 7/8 Verificação de saúde"
            sleep 5
            home=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$SITE_URL/" || true)
            api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$SITE_URL/api/licitacoes/" || true)
            echo "   /=$home (esperado 200)  /api/licitacoes/=$api (esperado 401)"
            if [ "$home" != "200" ] || [ "$api" != "401" ]; then
              echo "### Verificação falhou: voltando o código para $PREV"
              git reset --hard "$PREV"
              sudo find . \( -path ./venv -o -path ./.git \) -prune -o -exec chown "$APP_USER:$APP_USER" {} +
              run "$PY" manage.py collectstatic --noinput || true
              run touch buscalicitacoes/wsgi.py
              echo "### Atenção: migrações já aplicadas NÃO são desfeitas. Backup: $APP_DIR/backups"
              exit 1
            fi

            # ------------------------------------------------------------------
            # Só depois de o site estar saudável: (re)inicia a atualização
            # automática com o código novo. Este passo NUNCA derruba nem reverte o
            # site (ele já está no ar): cada falha é impressa com o motivo e o job
            # termina vermelho no fim, para você ver.
            # ------------------------------------------------------------------
            set +e +o pipefail
            trap - ERR
            AVISOS=0
            aviso() { echo "### AVISO: $*"; AVISOS=1; }

            echo "== 8/8 Atualização automática (Celery worker + beat)"
            if ! sudo -n true 2>/dev/null; then
              aviso "o usuário do deploy não tem sudo sem senha; não dá para instalar/reiniciar os serviços."
            elif ! command -v systemctl >/dev/null 2>&1; then
              aviso "systemctl não encontrado."
            else
              # nomes antigos (se algum dia existiram) saem de cena
              for u in celery-worker celery-beat; do
                if [ -f "/etc/systemd/system/$u.service" ]; then
                  sudo systemctl disable --now "$u" 2>&1 | tail -1
                fi
              done

              if ! systemctl is-active --quiet redis-server; then
                aviso "redis-server não está ativo (systemctl is-active redis-server)."
                echo "   O Redis precisa estar rodando para o Celery (veja deploy/LEIA-ME.md)."
              else
                RELOAD=0
                for u in buscalicitacoes-worker buscalicitacoes-beat; do
                  src="deploy/systemd/$u.service"; dst="/etc/systemd/system/$u.service"
                  if [ ! -f "$src" ]; then aviso "$src não existe no repositório."; continue; fi
                  if ! sudo cmp -s "$src" "$dst"; then
                    if sudo cp "$src" "$dst"; then
                      echo "   $u: unidade instalada/atualizada"; RELOAD=1
                    else
                      aviso "não consegui copiar $src para $dst."
                    fi
                  fi
                done
                if [ "$RELOAD" = 1 ]; then
                  sudo systemctl daemon-reload || aviso "systemctl daemon-reload falhou."
                fi
                for u in buscalicitacoes-worker buscalicitacoes-beat; do
                  sudo systemctl enable "$u" 2>&1 | tail -1
                  sudo systemctl restart "$u" || aviso "systemctl restart $u falhou."
                done
                sleep 6
                for u in buscalicitacoes-worker buscalicitacoes-beat; do
                  if systemctl is-active --quiet "$u"; then
                    echo "   $u: ativo"
                  else
                    aviso "$u não está ativo. Estado e últimas linhas do log:"
                    sudo systemctl status "$u" --no-pager -n 0 2>&1 | head -12
                    sudo journalctl -u "$u" -n 30 --no-pager 2>&1
                  fi
                done
              fi
            fi

            echo "Site atualizado: $NEW"
            if [ "$AVISOS" != 0 ]; then
              echo "### O site está no ar com o código novo, mas a atualização automática (Celery) precisa de atenção (avisos acima)."
              exit 1
            fi
            echo "Deploy concluído: $NEW"
